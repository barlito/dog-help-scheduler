name: deploy

on:
  workflow_dispatch:
    inputs:
      re-deploy:
        description: Full stack deploy (docker stack deploy, no downtime) instead of a rolling image update
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: barlito/ci/.github/workflows/swarm-deploy.yaml@v1
    with:
      full: ${{ inputs.re-deploy }}
      images: barlito/doghelp barlito/doghelp-worker
      env-secrets: DB_PASSWORD APP_SECRET DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_ALLOWED_USER_ID MERCURE_JWT_SECRET
      castor: true
    secrets: inherit
